<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expo · Line board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#09090b; --panel:#0c0c0e; --card:#121214; --card-h:#17171a; --line:#1f1f23; --line2:#27272a;
    --fg:#fafafa; --fg2:#d4d4d8; --muted:#a1a1aa; --dim:#71717a; --faint:#52525b;
    --brand:#f97316; --blue:#3b82f6; --green:#22c55e; --amber:#f59e0b; --red:#ef4444;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; font-feature-settings:"cv11","ss01"; -webkit-font-smoothing:antialiased; background:var(--bg); color:var(--fg); display:grid; grid-template-columns:240px 1fr; overflow:hidden; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  svg { flex:none; }
  .mono { font-family:var(--mono); }

  /* sidebar */
  .side { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:14px 12px; gap:18px; min-height:0; }
  .ws { display:flex; align-items:center; gap:10px; padding:4px 6px; }
  .logo { width:28px; height:28px; border-radius:7px; background:linear-gradient(135deg,#fb923c,#ea580c); display:grid; place-items:center; color:#fff; font-weight:700; font-size:14px; box-shadow:inset 0 1px 0 rgba(255,255,255,.25); }
  .ws b { display:block; font-size:14px; font-weight:600; letter-spacing:-.1px; }
  .ws small { display:block; font-size:12px; color:var(--dim); }
  .navs { display:flex; flex-direction:column; gap:2px; }
  .navs .lbl { font-size:11px; font-weight:500; color:var(--faint); padding:8px 8px 4px; }
  .navs a { display:flex; align-items:center; gap:10px; height:32px; padding:0 8px; border-radius:6px; color:var(--muted); text-decoration:none; font-weight:500; font-size:13px; }
  .navs a.on { background:var(--card-h); color:var(--fg); box-shadow:inset 0 0 0 1px var(--line2); }
  .navs a .k { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--dim); }
  .grow { flex:1; }

  .agent { border:1px solid var(--line2); background:var(--card); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .agent .hd { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); font-weight:500; }
  .agent .st { display:flex; align-items:center; gap:10px; }
  .wave { display:flex; align-items:center; gap:2px; height:18px; }
  .wave i { width:3px; height:4px; border-radius:2px; background:var(--faint); transition:background .2s; }
  body[data-voice="listening"] .wave i { background:var(--green); animation:idle 1.6s ease-in-out infinite; }
  body[data-voice="speaking"] .wave i { background:var(--blue); animation:talk .55s ease-in-out infinite alternate; }
  body[data-voice="connecting"] .wave i { background:var(--amber); animation:idle .8s ease-in-out infinite; }
  body[data-voice="failed"] .wave i { background:var(--red); }
  .wave i:nth-child(2) { animation-delay:-.15s !important; } .wave i:nth-child(3) { animation-delay:-.3s !important; } .wave i:nth-child(4) { animation-delay:-.45s !important; } .wave i:nth-child(5) { animation-delay:-.6s !important; }
  @keyframes idle { 50% { height:7px; } }
  @keyframes talk { from { height:4px; } to { height:18px; } }
  #state { font-size:14px; font-weight:600; text-transform:capitalize; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  body[data-voice="listening"] #state { color:var(--green); }
  body[data-voice="speaking"] #state { color:#93c5fd; }
  body[data-voice="failed"] #state { color:var(--red); font-size:12px; text-transform:none; white-space:normal; }
  .agent .meta { font-family:var(--mono); font-size:11px; color:var(--faint); }
  input { font:inherit; font-size:12px; font-family:var(--mono); height:32px; padding:0 10px; border-radius:7px; border:1px solid var(--line2); background:var(--bg); color:var(--fg); width:100%; outline:none; }
  input:focus { border-color:var(--faint); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:32px; padding:0 12px; border-radius:7px; font-size:13px; font-weight:500; border:1px solid var(--line2); background:var(--card); color:var(--fg2); transition:background .12s, border-color .12s; white-space:nowrap; }
  .btn:hover { background:var(--card-h); border-color:#3f3f46; }
  #start { width:100%; background:var(--fg); color:#09090b; border-color:var(--fg); font-weight:600; }
  #start:hover { background:#e4e4e7; }
  body.live #start { background:var(--card); color:var(--fg2); border-color:var(--line2); }
  body.live #agent { display:none; }

  /* main */
  .main { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .top { display:flex; align-items:center; gap:10px; height:52px; padding:0 20px; border-bottom:1px solid var(--line); }
  .crumb { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim); font-weight:500; }
  .crumb b { color:var(--fg); font-weight:500; }
  .livepill { display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 8px; border-radius:999px; border:1px solid var(--line2); font-size:11px; font-weight:500; color:var(--muted); margin-left:6px; }
  .livepill i { width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(34,197,94,.15); }
  .spacer { flex:1; }
  #out:empty { display:none; }
  #out { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border-radius:7px; background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:#fca5a5; font-size:12px; font-weight:600; text-transform:capitalize; }

  .content { flex:1; min-height:0; display:grid; grid-template-columns:1fr 340px; }
  .work { min-width:0; overflow:auto; padding:20px; display:flex; flex-direction:column; gap:20px; }
  .stats { flex:none; display:grid; grid-template-columns:repeat(4, 1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .stat { background:var(--panel); padding:14px 16px; }
  .stat .l { font-size:12px; color:var(--dim); font-weight:500; display:flex; align-items:center; gap:6px; }
  .stat .v { font-size:26px; font-weight:600; letter-spacing:-.6px; margin-top:2px; font-variant-numeric:tabular-nums; }
  .stat .v small { font-size:13px; color:var(--dim); font-weight:500; letter-spacing:0; margin-left:4px; }
  .stat.bad .v { color:#fca5a5; }

  #board { flex:none; display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:16px; align-items:start; }
  .col-h { display:flex; align-items:center; gap:8px; padding:0 2px 10px; font-size:13px; font-weight:500; color:var(--fg2); }
  .col-h .ic { width:14px; height:14px; border-radius:50%; border:2px solid; }
  .col-h .n { font-family:var(--mono); font-size:12px; color:var(--dim); }
  .col.new .ic { border-color:var(--muted); border-style:dashed; }
  .col.fired .ic { border-color:var(--amber); background:conic-gradient(var(--amber) 0 50%, transparent 0); }
  .col.flagged .ic { border-color:var(--red); background:var(--red); }
  .col-b { display:flex; flex-direction:column; gap:10px; min-height:80px; }
  .empty { border:1px dashed var(--line2); border-radius:10px; height:80px; display:grid; place-items:center; color:var(--faint); font-size:12px; }

  .t { background:var(--card); border:1px solid var(--line2); border-radius:10px; padding:14px; box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 4px 12px rgba(0,0,0,.25); transition:border-color .3s, box-shadow .3s; }
  .t:hover { background:var(--card-h); }
  .t .h { display:flex; align-items:center; gap:8px; }
  .t .id { font-family:var(--mono); font-size:12px; color:var(--dim); }
  .t .age { margin-left:auto; font-family:var(--mono); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; display:inline-flex; align-items:center; gap:5px; }
  .t .age.warn { color:var(--amber); } .t .age.late { color:var(--red); }
  .t h2 { margin:8px 0 10px; font-size:22px; font-weight:600; letter-spacing:-.5px; }
  .t ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .t li { display:flex; align-items:flex-start; gap:10px; }
  .t li .em { width:26px; height:26px; flex:none; border-radius:6px; background:var(--bg); border:1px solid var(--line2); display:grid; place-items:center; font-size:14px; }
  .t li .nm { font-size:15px; font-weight:500; text-transform:capitalize; color:var(--fg); }
  .t .mods { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .t .mod { font-size:11px; font-weight:500; color:#fcd34d; background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.25); border-radius:5px; padding:1px 6px; }
  .t li.out .nm { color:var(--dim); text-decoration:line-through; text-decoration-color:var(--red); text-decoration-thickness:2px; }
  .t li.out .em { opacity:.5; }
  .tag { display:inline-flex; align-items:center; gap:5px; height:20px; padding:0 7px; border-radius:5px; font-size:11px; font-weight:600; border:1px solid; }
  .tag.red { color:#fca5a5; background:rgba(239,68,68,.1); border-color:rgba(239,68,68,.3); }
  .tag.amber { color:#fcd34d; background:rgba(245,158,11,.08); border-color:rgba(245,158,11,.3); }
  .tag.gray { color:var(--muted); background:var(--card-h); border-color:var(--line2); }
  .t.fired { border-color:rgba(245,158,11,.35); }
  .t.flagged { border-color:rgba(239,68,68,.45); box-shadow:0 0 0 1px rgba(239,68,68,.15), 0 8px 24px rgba(239,68,68,.12); }
  .t .foot { display:flex; align-items:center; gap:6px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
  .t .foot svg { color:var(--green); }
  .t.fresh { animation:fresh 2.4s ease-out; }
  .t.hit { animation:hit 1.6s ease-out; }
  @keyframes fresh { 0% { border-color:var(--blue); box-shadow:0 0 0 4px rgba(59,130,246,.25); } 100% {} }
  @keyframes hit { 0% { box-shadow:0 0 0 6px rgba(239,68,68,.35); } 100% {} }

  /* transcript */
  aside { border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  aside .ah { display:flex; align-items:center; gap:8px; height:44px; padding:0 16px; border-bottom:1px solid var(--line); font-size:13px; font-weight:500; }
  aside .ah span { margin-left:auto; font-size:11px; color:var(--dim); font-family:var(--mono); }
  #log { flex:1; overflow:auto; padding:12px 16px 16px; display:flex; flex-direction:column; gap:14px; }
  .line { font-size:14px; color:var(--fg2); line-height:1.5; animation:in .3s ease-out; }
  .line b { display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600; color:var(--dim); letter-spacing:.2px; margin-bottom:3px; }
  .line b::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--faint); }
  .line.agent b { color:#93c5fd; } .line.agent b::before { background:var(--blue); }
  .line:not(.agent):not(.sys) b::before { background:var(--green); }
  .line .tm { margin-left:auto; font-family:var(--mono); font-weight:400; color:var(--faint); letter-spacing:0; }
  .line.sys { font-family:var(--mono); font-size:11.5px; color:var(--dim); padding-left:12px; border-left:1px solid var(--line2); }
  #log .line:first-child:not(.sys) { font-size:16px; color:var(--fg); }
  @keyframes in { from { opacity:0; transform:translateY(-4px); } }

  /* toast + qr */
  #toast { position:fixed; right:20px; bottom:20px; z-index:20; width:380px; background:var(--card); border:1px solid rgba(239,68,68,.45); border-radius:12px; padding:14px 16px; box-shadow:0 20px 50px rgba(0,0,0,.5); display:flex; gap:12px; transform:translateY(16px); opacity:0; visibility:hidden; transition:all .3s cubic-bezier(.2,.9,.3,1); }
  #toast.show { transform:none; opacity:1; visibility:visible; }
  #toast .ic { width:28px; height:28px; border-radius:7px; background:rgba(239,68,68,.12); color:var(--red); display:grid; place-items:center; flex:none; }
  #toast b { display:block; font-size:14px; font-weight:600; text-transform:capitalize; }
  #toast span { display:block; font-size:13px; color:var(--muted); margin-top:2px; }
  #qr { position:fixed; inset:0; z-index:30; display:none; place-items:center; background:rgba(0,0,0,.7); backdrop-filter:blur(4px); }
  #qr.show { display:grid; }
  #qr .card { background:var(--card); border:1px solid var(--line2); border-radius:14px; padding:24px; text-align:center; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  #qr .card b { display:block; font-size:16px; font-weight:600; }
  #qr .card span { display:block; color:var(--muted); font-size:13px; margin:2px 0 16px; }
  #qr-img { background:#fff; border-radius:10px; padding:12px; }
  #qr-img svg { width:min(54vh, 72vw); height:auto; display:block; }
  #qr .url { margin-top:12px; font:12px var(--mono); color:var(--dim); }
  @media (max-width: 1100px) { .content { grid-template-columns:1fr; } aside { display:none; } }
  @media (max-width: 760px) { body { grid-template-columns:1fr; overflow:auto; height:auto; } .side { display:none; } #board { grid-template-columns:1fr; } .stats { grid-template-columns:repeat(2, 1fr); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>

  <div class="navs">

    <a href="#" id="nav-86"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg>86 list<span class="k" id="nav-86n">0</span></a>

<!-- Vendored @elevenlabs/client 1.28.0 (IIFE build) so the demo needs no CDN. -->
<script src="static/elevenlabs-client-1.28.0.js"></script>
<script type="module">
const { Conversation } = window.ElevenLabsClient;

const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
$('#agent').value = params.get('agent') || store.get('expo-agent') || '';

let convo = null, mode = 'listening', seen = null;
const queue = [];
// Test hook for headless runs: read-only view of the page's state.
window.__expo = { get mode() { return mode; }, get connected() { return !!convo; }, get queued() { return queue.length; } };

function log(who, text, cls = '') {
  const d = document.createElement('div');
  d.className = 'line ' + cls;
  d.innerHTML = who ? `<b>${who}</b>` : '';
  d.append(text);
  $('#log').prepend(d);
}

function chime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1320].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i * 0.12;
      g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o.start(t); o.stop(t + 0.25);
    });
  } catch {}
}

// Send queued callouts only while the agent isn't talking, so it doesn't talk over itself.
function flush() {
  if (!convo || mode === 'speaking' || !queue.length) return;
  const text = queue.shift();
  convo.sendUserMessage(`[NEW TICKET] ${text}`);
  log('', 'ticket sent to Expo: ' + text, 'sys');
}
setInterval(flush, 300);

function announce(callout) {
  chime();
  if (convo) queue.push(callout);
  else log('', 'new ticket (Expo not connected): ' + callout, 'sys');
}

$('#start').onclick = async () => {
  if (convo) { await convo.endSession(); convo = null; $('#start').textContent = 'Start Expo'; return; }
  const agentId = $('#agent').value.trim();
  if (!agentId) { alert('Paste the ElevenLabs agent ID first'); return; }
  store.set('expo-agent', agentId);
  $('#state').textContent = 'connecting…';
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    convo = await Conversation.startSession({
      agentId,
      connectionType: params.get('conn') === 'websocket' ? 'websocket' : 'webrtc',
      onConnect: () => { $('#state').textContent = 'listening'; $('#state').className = 'on'; },
      onDisconnect: () => { convo = null; $('#state').textContent = 'not connected'; $('#state').className = ''; $('#start').textContent = 'Start Expo'; },
      onModeChange: (m) => { mode = m.mode; $('#state').textContent = m.mode; },
      onMessage: (m) => {
        const text = m.message || '';
        if (text.startsWith('[NEW TICKET]')) return;
        log(m.source === 'ai' || m.role === 'agent' ? 'EXPO' : 'MARCO', text, m.source === 'ai' || m.role === 'agent' ? 'agent' : '');
      },
      onError: (e) => log('', 'error: ' + (e?.message || e), 'sys'),
    });
    $('#start').textContent = 'Stop';
  } catch (e) {
    $('#state').textContent = 'failed: ' + (e?.message || e);
    convo = null;
  }
};

$('#test').onclick = () => announce('Ordering, table 12: classic burger, extra cheese, hold the onions.');
$('#reset').onclick = async () => { await fetch('reset', { method: 'POST' }); seen = null; queue.length = 0; };

function render(orders, out = []) {
  const board = $('#board');
  const prev = new Map([...board.querySelectorAll('.t')].map(c => [c.dataset.id, c.dataset.status]));
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const EM = { 'classic burger': '🍔', 'salmon burger': '🐟', 'veggie burger': '🌱', 'chicken sandwich': '🍗', 'fries': '🍟' };
  const COLS = [['new', 'New'], ['fired', 'Firing'], ['flagged', 'Needs attention']];
  const now = Date.now() / 1000;
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const sorted = [...orders].sort((a, b) => a.created - b.created);
  board.innerHTML = '';
  for (const [key, name] of COLS) {
    const list = sorted.filter(o => (o.status === 'done' ? 'fired' : o.status) === key);
    const col = document.createElement('div');
    col.className = 'col ' + key;
    col.innerHTML = `<div class="col-h"><span class="ic"></span>${name}<span class="n">${list.length}</span></div><div class="col-b"></div>`;
    const body = col.lastChild;
    if (!list.length) body.innerHTML = `<div class="empty">No tickets</div>`;
    for (const o of list) {
      const el = document.createElement('div');
      el.dataset.id = o.id; el.dataset.status = o.status;
      const was = prev.get(String(o.id));
      el.className = 't ' + o.status + (prev.size && was === undefined ? ' fresh' : '')
        + (o.status === 'flagged' && was && was !== 'flagged' ? ' hit' : '');
      const secs = Math.max(0, now - o.created), mins = secs / 60;
      const tag = o.status === 'fired' ? '<span class="tag amber">Fired</span>' : o.status === 'flagged' ? '<span class="tag red">86</span>' : '<span class="tag gray">New</span>';
      const swap = (o.message || '').match(/swap in an? ([a-z ]+?) at no charge/);
      el.innerHTML = `<div class="h"><span class="id">#${String(o.id).padStart(3, '0')}</span>${tag}<span class="age ${mins >= 10 ? 'late' : mins >= 5 ? 'warn' : ''}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${fmt(secs)}</span></div>
        <h2>Table ${o.table}</h2>
        <ul>${o.items.map(i => { const x = o.status === 'flagged' && out.includes(i.name);
          return `<li class="${x ? 'out' : ''}"><span class="em">${EM[i.name] || '🍽️'}</span><div><div class="nm">${esc(i.name)}</div>${
            i.mods.length ? `<div class="mods">${i.mods.map(m => `<span class="mod">${esc(m)}</span>`).join('')}</div>` : ''}</div></li>`; }).join('')}</ul>
        ${o.status === 'flagged' ? `<div class="foot"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>Guest notified${swap ? ' · swap to ' + esc(swap[1]) : ''} · drink comped</div>` : ''}`;
      body.append(el);
    }
    board.append(col);
  }
  // Summary stats
  $('#s-open').textContent = orders.length;
  $('#nav-open').textContent = orders.length;
  $('#s-old').textContent = sorted.length ? fmt(now - sorted[0].created) : '0:00';
  $('#s-86').textContent = out.length;
  $('#nav-86n').textContent = out.length;
  $('#s-86-wrap').classList.toggle('bad', out.length > 0);
  $('#s-notified').textContent = orders.filter(o => o.message).length;
}

async function poll() {
  try {
    const d = await (await fetch('orders')).json();
    if (seen === null) seen = new Set(d.orders.map(o => o.id)); // don't call out what's already on the board
    for (const o of d.orders) if (!seen.has(o.id)) { seen.add(o.id); announce(o.callout); }
    render(d.orders, d.eighty_sixed);
    $('#out').textContent = d.eighty_sixed.length ? '86: ' + d.eighty_sixed.join(', ') : '';
  } catch (e) {}
  setTimeout(poll, 1000);
}
poll();
</script>
<!-- Display-only layer: voice indicator, 86 toast, transcript timestamps, QR modal. Reads the DOM the script above writes; no API logic here. -->
<script src="static/qrcode-2.0.4.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const syncVoice = () => {
    const t = $('#state').textContent.trim().toLowerCase();
    const v = t.startsWith('failed') ? 'failed' : t.startsWith('connecting') ? 'connecting'
      : t === 'speaking' ? 'speaking' : (t === 'listening' || t === 'thinking') ? 'listening' : 'off';
    document.body.dataset.voice = v;
    document.body.classList.toggle('live', v === 'listening' || v === 'speaking');
  };
  new MutationObserver(syncVoice).observe($('#state'), { childList: true, characterData: true, subtree: true });
  syncVoice();

  // Timestamp each transcript line as it arrives.
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
    if (!(n instanceof HTMLElement) || n.dataset.tm) return;
    n.dataset.tm = 1;
    const b = n.querySelector('b');
    if (b) { const s = document.createElement('span'); s.className = 'tm';
      s.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); b.append(s); }
  }))).observe($('#log'), { childList: true });

  // 86 toast when a new item appears in #out.
  let known = new Set(), hideT = null;
  new MutationObserver(() => {
    const items = $('#out').textContent.replace(/^86:\s*/, '').split(',').map(s => s.trim()).filter(Boolean);
    const added = items.filter(i => !known.has(i));
    known = new Set(items);
    if (!added.length || performance.now() < 2500) return; // skip 86s already on the board at load
    setTimeout(() => {
      const tables = [...document.querySelectorAll('.t.flagged h2')].map(h => h.textContent.replace(/\D/g, '')).sort((a, b) => a - b);
      $('#toast-t').textContent = '86 ' + added.join(', ');
      $('#toast-s').textContent = tables.length
        ? `${tables.length} ticket${tables.length > 1 ? 's' : ''} flagged (table${tables.length > 1 ? 's' : ''} ${tables.join(', ')}). Guests offered a swap and a comp.`
        : 'No open tickets affected.';
      $('#toast').classList.add('show');
      clearTimeout(hideT); hideT = setTimeout(() => $('#toast').classList.remove('show'), 7000);
    }, 150);
  }).observe($('#out'), { childList: true, characterData: true, subtree: true });

  const url = location.origin + location.pathname.replace(/kitchen\/?$/, '') + '?table=4';
  try {
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    $('#qr-img').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 1, scalable: true });
  } catch (e) {}
  $('#qr-url').textContent = url.replace(/^https?:\/\//, '');
  const toggleQR = on => $('#qr').classList.toggle('show', on);
  $('#qr-btn').onclick = e => { e.preventDefault(); toggleQR(true); };
  $('#nav-86').onclick = e => e.preventDefault();
  $('#qr').onclick = () => toggleQR(false);
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'q' || e.key === 'Q') toggleQR(!$('#qr').classList.contains('show'));
    if (e.key === 'Escape') toggleQR(false);
  });
  if (new URLSearchParams(location.search).has('qr')) toggleQR(true);
})();
</script>
