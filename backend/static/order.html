<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Flat Top Burgers · Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fafafa; --fg:#0a0a0a; --muted:#71717a; --subtle:#a1a1aa; --card:#fff; --line:#e4e4e7; --line2:#f4f4f5;
    --brand:#ea580c; --ok:#16a34a; --ok-bg:#f0fdf4; --red:#dc2626; --red-bg:#fef2f2; --red-line:#fecaca;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.02);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body { margin:0; font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; font-feature-settings:"cv11","ss01"; -webkit-font-smoothing:antialiased; background:var(--bg); color:var(--fg); }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }

  .nav { position:sticky; top:0; z-index:5; background:rgba(255,255,255,.85); backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line); }
  .nav .in { max-width:520px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:14px; letter-spacing:-.1px; }
  .mark { width:24px; height:24px; border-radius:6px; background:var(--fg); color:#fff; display:grid; place-items:center; font-size:13px; }
  .table-pill { position:relative; display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); font-size:13px; font-weight:500; box-shadow:var(--shadow); }
  .table-pill select { position:absolute; inset:0; opacity:0; font-size:16px; }
  .table-pill svg { color:var(--muted); }

  main { max-width:520px; margin:0 auto; padding:24px 16px calc(110px + env(safe-area-inset-bottom)); }
  h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:-.4px; }
  .sub { margin:4px 0 20px; color:var(--muted); }

  .list { background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
  .item { padding:14px; border-top:1px solid var(--line2); transition:background .15s; }
  .item:first-child { border-top:0; }
  .item.sel { background:#fcfcfc; }
  .row { display:flex; align-items:center; gap:12px; }
  .emoji { width:40px; height:40px; flex:none; border-radius:10px; background:var(--line2); border:1px solid var(--line); display:grid; place-items:center; font-size:20px; }
  .info { flex:1; min-width:0; }
  .name { font-weight:500; font-size:15px; text-transform:capitalize; }
  .desc { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item.out .name { color:var(--subtle); }
  .badge { display:inline-flex; align-items:center; gap:5px; height:20px; padding:0 7px; border-radius:6px; font-size:11px; font-weight:600; letter-spacing:.1px; border:1px solid; vertical-align:1px; }
  .badge.red { color:var(--red); background:var(--red-bg); border-color:var(--red-line); }
  .badge.green { color:var(--ok); background:var(--ok-bg); border-color:#bbf7d0; }
  .badge.gray { color:var(--muted); background:var(--line2); border-color:var(--line); }
  .badge.amber { color:#b45309; background:#fffbeb; border-color:#fde68a; }
  .add { height:32px; min-width:64px; padding:0 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); font-size:13px; font-weight:500; box-shadow:var(--shadow); display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:all .15s; }
  .add:active { transform:scale(.97); }
  .sel .add { background:var(--fg); border-color:var(--fg); color:#fff; }
  .add:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }
  .mods { display:none; flex-wrap:wrap; gap:6px; margin:12px 0 0 52px; }
  .item.sel .mods { display:flex; }
  .mods label { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border:1px solid var(--line); border-radius:999px; font-size:12.5px; font-weight:500; color:#3f3f46; background:var(--card); cursor:pointer; user-select:none; transition:all .12s; }
  .mods input { position:absolute; opacity:0; pointer-events:none; }
  .mods label:has(input:checked) { background:var(--fg); border-color:var(--fg); color:#fff; }

  .bar { position:fixed; left:0; right:0; bottom:0; z-index:5; background:rgba(255,255,255,.92); backdrop-filter:blur(12px); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bar .in { max-width:520px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .bar .count { flex:1; font-size:13px; color:var(--muted); }
  .bar .count b { color:var(--fg); font-weight:600; }
  #go { height:44px; padding:0 20px; border-radius:10px; background:var(--fg); color:#fff; font-weight:500; font-size:14px; display:inline-flex; align-items:center; gap:8px; box-shadow:0 1px 2px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.1); transition:opacity .15s; }
  #go:disabled { opacity:.3; }
  .err { color:var(--red); font-size:13px; min-height:1.5em; margin:10px 2px 0; }

  /* status */
  #status { display:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
  .card-h { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 16px; border-bottom:1px solid var(--line2); }
  .card-h .t { font-weight:600; }
  .mono { font-family:var(--mono); font-size:12px; color:var(--muted); }
  .lines { list-style:none; margin:0; padding:4px 16px; }
  .lines li { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--line2); }
  .lines li:first-child { border-top:0; }
  .lines .nm { font-weight:500; text-transform:capitalize; }
  .lines .md { color:var(--muted); font-size:13px; }
  .lines li.gone .nm { color:var(--subtle); text-decoration:line-through; text-decoration-color:var(--red); text-decoration-thickness:1.5px; }
  .lines .em { font-size:18px; width:28px; flex:none; }
  .lines .grow { flex:1; min-width:0; }

  .timeline { list-style:none; margin:0; padding:14px 16px 6px; }
  .timeline li { position:relative; display:flex; gap:12px; padding-bottom:16px; }
  .timeline li:not(:last-child)::before { content:""; position:absolute; left:9px; top:22px; bottom:2px; width:1px; background:var(--line); }
  .timeline li.done:not(:last-child)::before { background:var(--ok); }
  .dot { width:19px; height:19px; flex:none; border-radius:50%; border:1px solid var(--line); background:var(--card); display:grid; place-items:center; margin-top:1px; }
  .done .dot { background:var(--ok); border-color:var(--ok); color:#fff; }
  .now .dot { border-color:var(--brand); }
  .now .dot::after { content:""; width:7px; height:7px; border-radius:50%; background:var(--brand); animation:pulse 1.4s ease-in-out infinite; }
  .warn .dot { background:var(--red); border-color:var(--red); color:#fff; }
  @keyframes pulse { 50% { transform:scale(.6); opacity:.5; } }
  .timeline b { display:block; font-weight:500; }
  .timeline span { color:var(--muted); font-size:13px; }
  .timeline li.todo b { color:var(--subtle); }

  .notice { display:none; margin-bottom:16px; border:1px solid var(--red-line); background:var(--card); border-radius:12px; overflow:hidden; box-shadow:0 4px 16px rgba(220,38,38,.08); animation:in .35s ease-out; }
  .notice.show { display:block; }
  @keyframes in { from { opacity:0; transform:translateY(-6px); } }
  .notice .nh { display:flex; align-items:center; gap:8px; padding:12px 16px; background:var(--red-bg); border-bottom:1px solid var(--red-line); color:var(--red); font-weight:600; font-size:13px; }
  .notice .nb { padding:14px 16px 4px; font-size:14.5px; line-height:1.55; }
  .notice .lines { padding:4px 16px 8px; }
  .notice .lines li { font-size:13.5px; }
  .notice .lines .price { font-family:var(--mono); font-size:12px; color:var(--ok); }

  .again { width:100%; height:42px; margin-top:16px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-weight:500; box-shadow:var(--shadow); }
  .foot { margin-top:20px; text-align:center; color:var(--subtle); font-size:12px; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="nav"><div class="in">
  <div class="brand"><div class="mark">🍔</div>Flat Top Burgers</div>
  <label class="table-pill"><span id="table-label">Table 4</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    <select id="table" aria-label="Table"></select></label>
</div></div>

<main>
  <section id="menu-view">
    <h1>Order</h1>
    <p class="sub">Choose items and send them straight to the line.</p>
    <div class="list" id="menu"></div>
    <p class="err" id="err"></p>
  </section>

  <section id="status">
    <div class="notice" id="notice" role="alert">
      <div class="nh"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>Update from the kitchen</div>
      <div class="nb" id="notice-msg"></div>
      <ul class="lines" id="notice-lines"></ul>
    </div>
    <div class="card">
      <div class="card-h"><div><div class="t" id="st-title">Order received</div><div class="mono" id="st-id"></div></div><span id="st-badge"></span></div>
      <ol class="timeline" id="timeline"></ol>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="card-h"><div class="t">Your items</div><span class="mono" id="st-table"></span></div>
      <ul class="lines" id="st-items"></ul>
    </div>
    <button class="again" id="again">Order something else</button>
    <p class="foot">Powered by CallOut · voice expediting for kitchens</p>
  </section>
</main>

<div class="bar" id="bar"><div class="in">
  <div class="count" id="count">No items selected</div>
  <button id="go" disabled>Place order
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
</div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const LOOK = {
  'classic burger':   ['🍔', 'Smash patty, American cheese, house sauce'],
  'salmon burger':    ['🐟', 'Seared salmon, dill slaw, lemon aioli'],
  'veggie burger':    ['🌱', 'Black bean patty, avocado, pickled onion'],
  'chicken sandwich': ['🍗', 'Crispy thigh, pickles, honey butter'],
  'fries':            ['🍟', 'Hand-cut, sea salt'],
};
const CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>';
const tSel = $('#table');
const qTable = new URLSearchParams(location.search).get('table') || '4';
for (let i = 1; i <= 12; i++) tSel.add(new Option('Table ' + i, i, false, String(i) === qTable));
const syncTable = () => { $('#table-label').textContent = 'Table ' + tSel.value; };
tSel.onchange = syncTable; syncTable();
const chosen = new Map();

function updateBar() {
  const n = chosen.size;
  $('#go').disabled = n === 0;
  $('#count').innerHTML = n ? `<b>${n} item${n > 1 ? 's' : ''}</b> · Table ${tSel.value}` : 'No items selected';
}

async function loadMenu() {
  const { items } = await (await fetch('menu')).json();
  $('#menu').innerHTML = '';
  chosen.clear(); updateBar();
  for (const it of items) {
    const [emoji, desc] = LOOK[it.name] || ['🍽️', ''];
    const el = document.createElement('div');
    el.className = 'item' + (it.sold_out ? ' out' : '');
    el.innerHTML = `<div class="row"><div class="emoji">${emoji}</div>
      <div class="info"><div class="name">${esc(it.name)} ${it.sold_out ? '<span class="badge red">Sold out</span>' : ''}</div><div class="desc">${esc(desc)}</div></div>
      <button class="add" ${it.sold_out ? 'disabled' : ''}>Add</button></div>
      <div class="mods">${it.mods.map(m => `<label><input type="checkbox" value="${esc(m)}">${esc(m)}</label>`).join('')}</div>`;
    const btn = el.querySelector('.add');
    if (!it.sold_out) btn.onclick = () => {
      const on = !chosen.has(it.name);
      if (on) chosen.set(it.name, el); else chosen.delete(it.name);
      el.classList.toggle('sel', on);
      btn.innerHTML = on ? CHECK + 'Added' : 'Add';
      updateBar();
    };
    $('#menu').append(el);
  }
}

let pollTimer = null, alerted = false, placedAt = null;

$('#go').onclick = async () => {
  $('#go').disabled = true; $('#err').textContent = '';
  const items = [...chosen].map(([name, el]) => ({
    name, mods: [...el.querySelectorAll('input:checked')].map(i => i.value) }));
  try {
    const r = await fetch('order', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ table: +tSel.value, items }) });
    const d = await r.json();
    if (!r.ok) { $('#err').textContent = d.detail || 'Could not place order. Try again.'; loadMenu(); return; }
    show('status');
    alerted = false; placedAt = new Date();
    $('#notice').classList.remove('show');
    $('#st-id').textContent = 'ORD-' + String(d.id).padStart(4, '0');
    $('#st-table').textContent = 'TABLE ' + String(tSel.value).padStart(2, '0');
    poll(d.id);
  } catch (e) {
    $('#err').textContent = 'No connection. Try again.'; updateBar();
  }
};

$('#again').onclick = () => { clearTimeout(pollTimer); show('menu'); loadMenu(); window.scrollTo(0, 0); };

function show(view) {
  const s = view === 'status';
  $('#menu-view').style.display = s ? 'none' : '';
  $('#bar').style.display = s ? 'none' : '';
  $('#status').style.display = s ? 'block' : 'none';
}

const hhmm = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
function render(o) {
  const msg = o.message || '';
  const gone = msg ? (o.items.find(i => msg.includes(i.name)) || {}).name : null;
  const badge = { new: ['gray', 'Received'], fired: ['amber', 'Cooking'], flagged: ['red', 'Action needed'], done: ['green', 'Ready'] }[o.status] || ['gray', o.status];
  $('#st-badge').innerHTML = `<span class="badge ${badge[0]}">${badge[1]}</span>`;
  $('#st-title').textContent = { new: 'Order received', fired: 'Your food is cooking', flagged: 'An item is unavailable', done: 'Ready' }[o.status] || 'Order received';

  const at = { new: 1, flagged: 1, fired: 2, done: 3 }[o.status] ?? 1;
  const steps = [
    ['Order placed', placedAt ? hhmm(placedAt) : ''],
    ['Kitchen notified', 'CallOut read your order out to the line chef'],
    ['Cooking', 'On the grill'],
    ['Ready', 'Brought to your table'],
  ];
  $('#timeline').innerHTML = steps.map(([t, s], i) => {
    let cls = i < at || (i === at && o.status === 'done') ? 'done' : i === at ? 'now' : 'todo';
    if (o.status === 'flagged' && i === 2) cls = 'warn', s = 'Paused, one item ran out';
    return `<li class="${cls}"><span class="dot">${cls === 'done' ? CHECK : cls === 'warn' ? '!' : ''}</span><div><b>${t}</b><span>${esc(s)}</span></div></li>`;
  }).join('');

  $('#st-items').innerHTML = o.items.map(i => {
    const out = i.name === gone;
    return `<li class="${out ? 'gone' : ''}"><span class="em">${(LOOK[i.name] || ['🍽️'])[0]}</span><div class="grow"><div class="nm">${esc(i.name)}</div>${
      i.mods.length ? `<div class="md">${i.mods.map(esc).join(' · ')}</div>` : ''}</div>${out ? '<span class="badge red">Sold out</span>' : ''}</li>`;
  }).join('');

  if (msg) {
    $('#notice-msg').textContent = msg;
    const swap = (msg.match(/swap in an? ([a-z ]+?) at no charge/) || [])[1];
    const comp = (msg.match(/and ([a-z ]+?) is on us/) || [])[1];
    $('#notice-lines').innerHTML =
      (swap ? `<li><span class="em">${(LOOK[swap] || ['🔁'])[0]}</span><div class="grow"><div class="nm">Swap: ${esc(swap)}</div><div class="md">Instead of the ${esc(gone || 'item')}</div></div><span class="price">$0.00</span></li>` : '') +
      (comp ? `<li><span class="em">🥤</span><div class="grow"><div class="nm" style="text-transform:none">${esc(comp[0].toUpperCase() + comp.slice(1))}</div><div class="md">On the house</div></div><span class="price">Free</span></li>` : '');
    $('#notice').classList.add('show');
    if (!alerted) { alerted = true; try { navigator.vibrate && navigator.vibrate([100, 60, 100]); } catch {} window.scrollTo({ top: 0, behavior: 'smooth' }); }
  }
}

async function poll(id) {
  try {
    const o = await (await fetch('order/' + id)).json();
    if (o && o.items) render(o);
  } catch (e) {}
  pollTimer = setTimeout(() => poll(id), 1500);
}
loadMenu();
</script>
</body>
</html>
